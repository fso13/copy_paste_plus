name: Check Flutter Dependencies

on:
  schedule:
    - cron: '0 9 * * 1' # Запуск каждый понедельник в 9:00 UTC
  workflow_dispatch:     # Ручной запуск во вкладке Actions

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check for outdated packages
        run: flutter pub outdated --no-color
