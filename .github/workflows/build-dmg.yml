name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build & upload DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS + DMG
        id: dmg
        env:
          # Optional: set repository secrets to enable Developer ID signing.
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE: ${{ secrets.NOTARIZE }}
        run: |
          chmod +x scripts/create_dmg.sh scripts/codesign_and_notarize.sh
          ./scripts/create_dmg.sh --build --ci
          DMG_FILE="$(ls dist/*.dmg | head -n 1)"
          echo "dmg_file=$DMG_FILE" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyPastePlus-dmg
          path: ${{ steps.dmg.outputs.dmg_file }}
          if-no-files-found: error

      - name: Upload DMG to GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg_file }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload DMG to existing Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.dmg.outputs.dmg_file }}" \
            --clobber
