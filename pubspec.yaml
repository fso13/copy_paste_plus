name: copy_paste_plus
description: "CopyPastePlus — менеджер буфера обмена для macOS"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  system_tray: ^2.0.3
  hotkey_manager: ^0.2.3
  shared_preferences: ^2.5.3
  uuid: ^3.0.6
  window_manager: ^0.5.1
  package_info_plus: ^9.0.1
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/
