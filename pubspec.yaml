name: copy_paste_plus
description: "CopyPastePlus — менеджер буфера обмена для macOS"
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  system_tray: ^2.0.3
  hotkey_manager: ^0.2.3
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  window_manager: ^0.5.2
  package_info_plus: ^10.2.1
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# system_tray still pins uuid ^3.x; API used (Uuid().v1) is compatible with 4.x
dependency_overrides:
  uuid: ^4.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/
